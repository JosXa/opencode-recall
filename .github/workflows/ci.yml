name: CI

on:
  push:
    branches: [main, opencode-v2, v2]
  pull_request:
    branches: [main, opencode-v2, v2]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build, and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run lint && pnpm run typecheck && pnpm test && pnpm run build && pnpm pack --pack-destination /tmp
