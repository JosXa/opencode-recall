name: Publish OpenCode V2 prerelease

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact package version to publish (must end in -opencode-v2)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/opencode-v2'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.9.0

      - name: Guard branch, package name, and prerelease version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node scripts/verify-release.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run lint && pnpm run typecheck && pnpm test && pnpm run build

      - name: Pack release artifact
        run: npm pack

      - name: Publish prerelease through npm OIDC
        run: npm publish josxa-opencode-recall-*.tgz --tag opencode-v2 --access public --provenance
