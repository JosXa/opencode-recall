    @keyframes pop { 0%, 6% { transform: scale(1); } 10% { transform: scale(1.1); } 14%, 100% { transform: scale(1); } }
    @keyframes step { 0%, 12% { opacity: 0.25; } 18%, 90% { opacity: 1; } 97%, 100% { opacity: 0.25; } }
    @keyframes flow { to { stroke-dashoffset: -10; } }
    @keyframes reveal { 0%, 42% { opacity: 0; transform: translateY(6px); } 50%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
  </style>
  <rect class="card" x="0.5" y="0.5" width="759" height="329" rx="14"/>
