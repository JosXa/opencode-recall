    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    .small { font-size: 13px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
    .pop { animation: pop 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .step { animation: step 8s ease-in-out infinite both; opacity: 0.25; }
    .s2 { animation-delay: 1.2s; }
