  <g class="reveal"><rect class="teal-bar" x="36" y="254" width="3" height="20" rx="1.5"/><text class="text" x="44" y="269">Freeze the clock with vi.useFakeTimers() in auth.spec.ts.</text></g>
  <g class="reveal r2"><text class="muted small" x="44" y="294">↳ "Fix flaky auth test"</text></g>
