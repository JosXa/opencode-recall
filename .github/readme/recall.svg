<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="You ask '@recall how did we fix the flaky auth test last time?'. Recall runs history_search and history_read, then answers with the fix and the source session.">
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
