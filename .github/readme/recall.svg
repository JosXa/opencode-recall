  <path class="wire flow" d="M350 170 H404"/>
  <g class="step s2"><rect class="chip" x="412" y="150" width="324" height="40" rx="20"/><text class="teal" x="432" y="175">history_read</text><text class="muted" x="554" y="175">around msg_…</text></g>
  <text class="label muted" x="32" y="230">ANSWER, WITH ITS SOURCE</text>
